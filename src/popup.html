<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Add to AiNKI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header><svg class="logo" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 18 Q 3.5 13 5 18 Q 8 10 11 18 Q 16 4 21 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot" cx="21" cy="18" r="2.3"/></svg><span>Add to AiNKI</span><button id="settings" class="link" type="button" aria-label="Extension settings" title="Settings"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5V3.5M8 12.5V14.5M1.5 8H3.5M12.5 8H14.5M3.4 3.4 4.8 4.8M11.2 11.2 12.6 12.6M3.4 12.6 4.8 11.2M11.2 4.8 12.6 3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button></header>
  <section id="connect" hidden>
    <p id="connect-why">Connect the extension to your AiNKI account first.</p>
    <button id="open-options" class="primary" type="button">Connect</button>
  </section>

  <form id="card" hidden>
    <label class="deck">Into <select id="deck" required></select></label>
    <label class="face">Front <textarea id="front" rows="2" placeholder="The question you'll be asked"></textarea></label>
    <div id="image" hidden>
      <img id="image-preview" alt="The picture for this card">
      <div class="side">
        On the
        <label><input type="radio" name="side" value="front"> front</label>
        <label><input type="radio" name="side" value="back"> back</label>
        <button id="image-remove" type="button" class="link">Remove</button>
      </div>
    </div>
    <label class="face">Back <textarea id="back" rows="5"></textarea></label>
    <p id="source" class="muted" hidden></p>
    <div class="actions">
      <button id="add" type="submit" class="primary">Add card</button>
      <span class="key">Ctrl + Enter</span>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</body>
</html>
