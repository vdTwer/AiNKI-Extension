name: package
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        run: echo "VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')" >> "$GITHUB_ENV"
      # GitHub zips every artifact itself, so upload the files, not a zip:
      # the download is then the extension zip, with manifest.json at its root.
      - uses: actions/upload-artifact@v4
        with:
          name: ainki-${{ env.VERSION }}
          path: |
            manifest.json
            icons/
            src/
          if-no-files-found: error
